name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep workspace test binaries within the hosted runner's disk budget.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    # Linux runners cost half as many Actions minutes as Windows runners.
    # The desktop app crate is left out: it needs a display stack that the
    # runner does not have, and it holds no logic that needs tests.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: debug0-v1-rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude sheaf-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude sheaf-app
