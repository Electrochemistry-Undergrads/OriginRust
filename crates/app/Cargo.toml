[package]
name = "sheaf-app"
description = "Desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sheaf-app"
path = "src/main.rs"

[dependencies]
sheaf-calc.workspace = true
sheaf-core.workspace = true
sheaf-io.workspace = true
sheaf-plot.workspace = true
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = "0.33"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["eframe"] }
