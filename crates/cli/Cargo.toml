[package]
name = "sheaf-cli"
description = "Command-line program: import, plot and export without a window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sheaf"
path = "src/main.rs"

[dependencies]
sheaf-core.workspace = true
sheaf-io.workspace = true
sheaf-plot.workspace = true
sheaf-ops.workspace = true
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
sheaf-mcp = { path = "../mcp" }
serde_json.workspace = true

[lints]
workspace = true
