[package]
name = "sheaf-core"
description = "Document model: project, workbooks, columns, graphs, undo history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
sheaf-expr.workspace = true
sheaf-calc.workspace = true
sheaf-fit.workspace = true

# Only for the local time zone offset (`now()` and `today()` in formulas); both are already in the lock file.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
