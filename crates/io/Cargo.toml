[package]
name = "sheaf-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sheaf-core = { workspace = true }
sheaf-expr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
# Excel import (xls, xlsx, xlsm): cached formula values and date detection, no Excel needed (ADR 0012).
calamine = { version = "0.38", default-features = false }
# Excel export (xlsx), pure Rust (ADR 0012).
rust_xlsxwriter = { version = "0.102", default-features = false }

[lints]
workspace = true
