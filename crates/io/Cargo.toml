[package]
name = "sheaf-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sheaf-core = { workspace = true }
sheaf-expr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
# Excel import (xls, xlsx, xlsm): cached formula values and date detection, no Excel needed (ADR 0012).
calamine = { version = "0.38", default-features = false }
# Excel export (xlsx), pure Rust (ADR 0012).
rust_xlsxwriter = { version = "0.102", default-features = false }
# File > Import > Image into a matrix book (T204): decoders only, no new crates beyond the lockfile.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
# File > Import > PDF Tables (T463): inflating FlateDecode streams; already in the lockfile through zip.
flate2 = "1.1"

[dev-dependencies]
# T463 tests write their PDFs with the writer the plot crate already uses.
pdf-writer = "0.12"

[lints]
workspace = true
