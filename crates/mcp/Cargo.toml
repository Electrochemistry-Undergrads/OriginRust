[package]
name = "sheaf-mcp"
description = "MCP server over stdio: lets AI assistants open data, plot, analyze, fit and export with Sheaf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "sheaf_mcp"
path = "src/lib.rs"

[[bin]]
name = "sheaf-mcp"
path = "src/main.rs"

[dependencies]
sheaf-core.workspace = true
sheaf-io.workspace = true
sheaf-plot.workspace = true
sheaf-ops.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
# Already locked through eframe. Protect the runtime token from inherited profile grants.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[lints]
workspace = true
