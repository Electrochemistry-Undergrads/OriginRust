[package]
name = "sheaf-plot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Turns a Sheaf graph and its data into SVG, PNG and PDF."

[dependencies]
sheaf-core = { workspace = true }
sheaf-calc = { workspace = true }
thiserror = { workspace = true }
# resvg/usvg 0.45 and fontdb 0.23 are the versions svg2pdf 0.13 is built on;
# using the same ones keeps a single copy of each in the build.
resvg = { version = "0.45", default-features = false, features = ["text"] }
usvg = { version = "0.45", default-features = false, features = ["text"] }
svg2pdf = "0.13"
# Multi-page PDF (graphing.md 9.6): the pdf-writer and deflate versions svg2pdf 0.13 is built on.
pdf-writer = "0.12"
miniz_oxide = "0.8"
fontdb = "0.23"
ttf-parser = "0.25"
png = "0.18"
# TIFF export (already in the build through the image decoders); LZW keeps files small.
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
# JPEG and GIF export: the image crate and colour quantiser already in Cargo.lock.
image = { version = "0.25", default-features = false, features = ["jpeg", "gif"] }
# Exact-palette GIFs (mono, 16 colours, grey); already built as a dependency of `image`.
gif = "0.14"
color_quant = "1.1"

[dev-dependencies]
roxmltree = "0.20"

[lints]
workspace = true
